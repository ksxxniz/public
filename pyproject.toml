[project]
name = "prompt-injection-protection"
version = "0.1.0"
description = "RAG 문서 속 프롬프트 인젝션 탐지 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.5.2",
    "confusable-homoglyphs>=3.3.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "rapidfuzz>=3.14.6",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
