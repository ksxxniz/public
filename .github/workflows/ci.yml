name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: 의존성 설치 (잠긴 버전 그대로)
        run: uv sync --locked

      - name: ruff 검사
        run: uv run ruff check .

      - name: ruff 포맷 검사
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -v

      - name: pipeline.run 스모크 테스트 (정상 문서)
        run: |
          echo "연차는 1년에 15일입니다." > /tmp/sample.txt
          uv run python -m pipeline.run --file /tmp/sample.txt --no-db

      - name: pipeline.run 스모크 테스트 (공격 문서, 스텁 부품)
        run: uv run python -m pipeline.run --file rag/scenario_data/leave_plain.txt --no-db

      - name: 작은 RAG 방어 ON/OFF 스모크 (시연 시나리오 전부, 실패 시 종료 코드 1)
        run: uv run python -m rag.demo
